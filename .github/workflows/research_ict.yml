name: Research — pure ICT strategy (standalone)

# Read-only research: run the canonical ICT model (kill zone -> premium/discount
# -> liquidity sweep -> MSS -> FVG entry) as a STANDALONE strategy over real
# Binance history and print its own win% / PF / OOS — no bot confluence attached.
# Writes nothing — inspect the job log for the result.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Hari data historis (mis. 1095 = 3 tahun)"
        required: false
        default: "1095"

permissions:
  contents: read

concurrency:
  group: research-ict
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pure-ICT standalone backtest
        env:
          RESEARCH_DAYS: ${{ github.event.inputs.days || '1095' }}
        run: python -m scripts.research_ict
