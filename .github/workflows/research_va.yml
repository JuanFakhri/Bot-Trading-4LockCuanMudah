name: Research — value-area + skip-Friday sweep

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Hari data historis (mis. 1095 = 3 tahun)"
        required: false
        default: "1095"

permissions:
  contents: read

concurrency:
  group: research-va
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run value-area sweep
        env:
          RESEARCH_DAYS: ${{ github.event.inputs.days || '1095' }}
        run: python -m scripts.research_va
