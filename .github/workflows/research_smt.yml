name: Research — SMT divergence filter

# Read-only research: add ICT "SMT divergence" (coin vs BTC/ETH disagreement on
# fresh HH/LL) as a confirmation filter on the live short machine and A/B it
# against the baseline over real Binance history, with OOS split. Writes
# nothing — inspect the job log for the result.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Hari data historis (mis. 1095 = 3 tahun)"
        required: false
        default: "1095"

permissions:
  contents: read

concurrency:
  group: research-smt
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SMT divergence sweep
        env:
          RESEARCH_DAYS: ${{ github.event.inputs.days || '1095' }}
        run: python -m scripts.research_smt
